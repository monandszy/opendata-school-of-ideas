<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenData – Warszawa Pogoda & 3D MapLibre</title>
    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }
        #maplibre-host {
            position: fixed;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
            z-index: 0;
            background: #121212;
            overflow: hidden;
        }
        canvas {
            position: relative;
            z-index: 1;
            background: transparent !important;
        }
    </style>
    <script>
        (function() {
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

            const origGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, attrs) {
                if (type === 'webgl' || type === 'webgl2') {
                    attrs = Object.assign({}, attrs, { alpha: true, premultipliedAlpha: true });
                }
                return origGetContext.call(this, type, attrs);
            };

            const state = {
                map: null,
                styleUrl: null,
                styleLoaded: false,
                heatmapDataUrl: null,
                heatmapCoords: null,
                showHeatmap: true,
                showStations: true,
                showToilets: true,
                showMiejscaChlodu: true,
                is3dMode: false,
                stationsGeoJsonStr: null,
                inspectionGeoJsonStr: null,
                toaletyGeoJsonStr: null,
                miejscaChloduGeoJsonStr: null,
                buildingColorExprJsonStr: null,
                offCanvas: null,
                offCanvasCtx: null
            };

            function ensureHostElement() {
                let el = document.getElementById('maplibre-host');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'maplibre-host';
                    document.body.prepend(el);
                }
                return el;
            }

            function applyOverlaysToMap() {
                const map = state.map;
                if (!map || !state.styleLoaded) return;

                let vectorSourceId = null;
                if (map.getSource('openmaptiles')) vectorSourceId = 'openmaptiles';
                else if (map.getSource('carto')) vectorSourceId = 'carto';
                else if (map.getSource('composite')) vectorSourceId = 'composite';
                else if (map.getStyle() && map.getStyle().sources) {
                    const sources = map.getStyle().sources;
                    for (let k in sources) {
                        if (sources[k] && sources[k].type === 'vector') {
                            vectorSourceId = k;
                            break;
                        }
                    }
                }

                const firstSymbol = (map.getStyle().layers || []).find(l => l.type === 'symbol');

                // 1. IDW Heatmap Raster Layer (Ground level, added first)
                if (state.heatmapDataUrl && state.heatmapCoords) {
                    const existingSource = map.getSource('idw-heatmap-source');
                    if (existingSource) {
                        existingSource.updateImage({
                            url: state.heatmapDataUrl,
                            coordinates: state.heatmapCoords
                        });
                    } else {
                        map.addSource('idw-heatmap-source', {
                            type: 'image',
                            url: state.heatmapDataUrl,
                            coordinates: state.heatmapCoords
                        });
                    }

                    if (!map.getLayer('idw-heatmap-layer')) {
                        map.addLayer({
                            id: 'idw-heatmap-layer',
                            type: 'raster',
                            source: 'idw-heatmap-source',
                            paint: {
                                'raster-opacity': 0.65,
                                'raster-resampling': 'linear'
                            },
                            layout: {
                                visibility: state.showHeatmap ? 'visible' : 'none'
                            }
                        }, firstSymbol ? firstSymbol.id : undefined);
                    } else {
                        map.setLayoutProperty(
                            'idw-heatmap-layer',
                            'visibility',
                            state.showHeatmap ? 'visible' : 'none'
                        );
                    }
                }

                // 2. 3D Building Extrusions Layer (Added after IDW Heatmap layer, before Symbols)
                const buildingOpacity = state.showHeatmap ? 0.60 : 0.85;
                const buildingColor = state.showHeatmap ? '#ffffff' : '#363c4a';

                if (vectorSourceId && !map.getLayer('warsaw-3d-buildings-layer')) {
                    map.addLayer({
                        id: 'warsaw-3d-buildings-layer',
                        type: 'fill-extrusion',
                        source: vectorSourceId,
                        'source-layer': 'building',
                        minzoom: 12,
                        paint: {
                            'fill-extrusion-color': buildingColor,
                            'fill-extrusion-height': ['coalesce', ['to-number', ['get', 'render_height']], ['coalesce', ['to-number', ['get', 'height']], 12]],
                            'fill-extrusion-base': ['coalesce', ['to-number', ['get', 'render_min_height']], ['coalesce', ['to-number', ['get', 'min_height']], 0]],
                            'fill-extrusion-opacity': buildingOpacity
                        },
                        layout: {
                            visibility: state.is3dMode ? 'visible' : 'none'
                        }
                    }, firstSymbol ? firstSymbol.id : undefined);
                }

                if (map.getLayer('warsaw-3d-buildings-layer')) {
                    map.setLayoutProperty(
                        'warsaw-3d-buildings-layer',
                        'visibility',
                        state.is3dMode ? 'visible' : 'none'
                    );
                    map.setPaintProperty('warsaw-3d-buildings-layer', 'fill-extrusion-color', buildingColor);
                    map.setPaintProperty('warsaw-3d-buildings-layer', 'fill-extrusion-opacity', buildingOpacity);
                }
                if (map.getLayer('building-3d')) {
                    map.setLayoutProperty(
                        'building-3d',
                        'visibility',
                        state.is3dMode ? 'visible' : 'none'
                    );
                    map.setPaintProperty('building-3d', 'fill-extrusion-color', buildingColor);
                    map.setPaintProperty('building-3d', 'fill-extrusion-opacity', buildingOpacity);
                }

                if (state.stationsGeoJsonStr) {
                    try {
                        const geojson = JSON.parse(state.stationsGeoJsonStr);
                        const existingStations = map.getSource('stations-source');
                        if (existingStations) {
                            existingStations.setData(geojson);
                        } else {
                            map.addSource('stations-source', {
                                type: 'geojson',
                                data: geojson
                            });
                        }

                        if (!map.getLayer('stations-circle-layer')) {
                            map.addLayer({
                                id: 'stations-circle-layer',
                                type: 'circle',
                                source: 'stations-source',
                                paint: {
                                    'circle-color': ['get', 'color'],
                                    'circle-radius': ['get', 'radius'],
                                    'circle-stroke-color': '#ffffff',
                                    'circle-stroke-width': ['get', 'strokeWidth'],
                                    'circle-pitch-alignment': 'map'
                                },
                                layout: {
                                    visibility: state.showStations ? 'visible' : 'none'
                                }
                            });
                            map.addLayer({
                                id: 'stations-symbol-layer',
                                type: 'symbol',
                                source: 'stations-source',
                                layout: {
                                    'text-field': ['get', 'icon'],
                                    'text-size': 11,
                                    'text-allow-overlap': true,
                                    'text-ignore-placement': true,
                                    'text-pitch-alignment': 'map',
                                    'visibility': state.showStations ? 'visible' : 'none'
                                }
                            });
                        } else {
                            map.setLayoutProperty(
                                'stations-circle-layer',
                                'visibility',
                                state.showStations ? 'visible' : 'none'
                            );
                            if (map.getLayer('stations-symbol-layer')) {
                                map.setLayoutProperty(
                                    'stations-symbol-layer',
                                    'visibility',
                                    state.showStations ? 'visible' : 'none'
                                );
                            }
                        }
                    } catch (e) {
                        console.error('Failed to parse stations GeoJSON', e);
                    }
                }

                if (state.toaletyGeoJsonStr) {
                    try {
                        const geojson = JSON.parse(state.toaletyGeoJsonStr);
                        const existingToalety = map.getSource('toalety-source');
                        if (existingToalety) {
                            existingToalety.setData(geojson);
                        } else {
                            map.addSource('toalety-source', {
                                type: 'geojson',
                                data: geojson
                            });
                        }

                        if (!map.getLayer('toalety-circle-layer')) {
                            map.addLayer({
                                id: 'toalety-circle-layer',
                                type: 'circle',
                                source: 'toalety-source',
                                paint: {
                                    'circle-color': ['get', 'color'],
                                    'circle-radius': ['get', 'radius'],
                                    'circle-stroke-color': '#ffffff',
                                    'circle-stroke-width': ['get', 'strokeWidth'],
                                    'circle-pitch-alignment': 'map'
                                },
                                layout: {
                                    visibility: state.showToilets ? 'visible' : 'none'
                                }
                            });
                            map.addLayer({
                                id: 'toalety-symbol-layer',
                                type: 'symbol',
                                source: 'toalety-source',
                                layout: {
                                    'text-field': ['get', 'icon'],
                                    'text-size': 11,
                                    'text-allow-overlap': true,
                                    'text-ignore-placement': true,
                                    'text-pitch-alignment': 'map',
                                    'visibility': state.showToilets ? 'visible' : 'none'
                                }
                            });
                        } else {
                            map.setLayoutProperty(
                                'toalety-circle-layer',
                                'visibility',
                                state.showToilets ? 'visible' : 'none'
                            );
                            if (map.getLayer('toalety-symbol-layer')) {
                                map.setLayoutProperty(
                                    'toalety-symbol-layer',
                                    'visibility',
                                    state.showToilets ? 'visible' : 'none'
                                );
                            }
                        }
                    } catch (e) {
                        console.error('Failed to parse toalety GeoJSON', e);
                    }
                }

                if (state.miejscaChloduGeoJsonStr) {
                    try {
                        const geojson = JSON.parse(state.miejscaChloduGeoJsonStr);
                        const existingMiejsca = map.getSource('miejsca-chlodu-source');
                        if (existingMiejsca) {
                            existingMiejsca.setData(geojson);
                        } else {
                            map.addSource('miejsca-chlodu-source', {
                                type: 'geojson',
                                data: geojson
                            });
                        }

                        if (!map.getLayer('miejsca-chlodu-circle-layer')) {
                            map.addLayer({
                                id: 'miejsca-chlodu-circle-layer',
                                type: 'circle',
                                source: 'miejsca-chlodu-source',
                                paint: {
                                    'circle-color': ['get', 'color'],
                                    'circle-radius': ['get', 'radius'],
                                    'circle-stroke-color': '#ffffff',
                                    'circle-stroke-width': ['get', 'strokeWidth'],
                                    'circle-pitch-alignment': 'map'
                                },
                                layout: {
                                    visibility: state.showMiejscaChlodu ? 'visible' : 'none'
                                }
                            });
                            map.addLayer({
                                id: 'miejsca-chlodu-symbol-layer',
                                type: 'symbol',
                                source: 'miejsca-chlodu-source',
                                layout: {
                                    'text-field': ['get', 'icon'],
                                    'text-size': 12,
                                    'text-allow-overlap': true,
                                    'text-ignore-placement': true,
                                    'text-pitch-alignment': 'map',
                                    'visibility': state.showMiejscaChlodu ? 'visible' : 'none'
                                }
                            });
                        } else {
                            map.setLayoutProperty(
                                'miejsca-chlodu-circle-layer',
                                'visibility',
                                state.showMiejscaChlodu ? 'visible' : 'none'
                            );
                            if (map.getLayer('miejsca-chlodu-symbol-layer')) {
                                map.setLayoutProperty(
                                    'miejsca-chlodu-symbol-layer',
                                    'visibility',
                                    state.showMiejscaChlodu ? 'visible' : 'none'
                                );
                            }
                        }
                    } catch (e) {
                        console.error('Failed to parse miejsca chlodu GeoJSON', e);
                    }
                }

                if (state.inspectionGeoJsonStr) {
                    try {
                        const geojson = JSON.parse(state.inspectionGeoJsonStr);
                        const existingInspection = map.getSource('inspection-source');
                        if (existingInspection) {
                            existingInspection.setData(geojson);
                        } else {
                            map.addSource('inspection-source', {
                                type: 'geojson',
                                data: geojson
                            });
                        }

                        if (!map.getLayer('inspection-circle-layer')) {
                            map.addLayer({
                                id: 'inspection-circle-layer',
                                type: 'circle',
                                source: 'inspection-source',
                                paint: {
                                    'circle-color': ['get', 'color'],
                                    'circle-radius': ['get', 'radius'],
                                    'circle-stroke-color': '#ffffff',
                                    'circle-stroke-width': ['get', 'strokeWidth'],
                                    'circle-pitch-alignment': 'map'
                                }
                            });
                        }
                    } catch (e) {
                        console.error('Failed to parse inspection GeoJSON', e);
                    }
                }
            }

            function formatCameraState(map) {
                if (!map) return '';
                const c = map.getCenter();
                return [c.lat, c.lng, map.getZoom(), map.getPitch(), map.getBearing()].join(',');
            }

            window.warsawMapBridge = {
                setViewport: function(leftPx, topPx, widthPx, heightPx) {
                    const dpr = window.devicePixelRatio || 1;
                    const el = ensureHostElement();
                    el.style.left = (leftPx / dpr) + 'px';
                    el.style.top = (topPx / dpr) + 'px';
                    el.style.width = (widthPx / dpr) + 'px';
                    el.style.height = (heightPx / dpr) + 'px';
                    if (state.map) {
                        state.map.resize();
                    }
                },

                ensureMap: function(styleUrl, lat, lon, zoom, pitch, bearing) {
                    ensureHostElement();
                    if (!window.maplibregl) return;

                    if (!state.map) {
                        state.styleUrl = styleUrl;
                        state.styleLoaded = false;
                        const map = new window.maplibregl.Map({
                            container: 'maplibre-host',
                            style: styleUrl,
                            center: [lon, lat],
                            zoom: zoom,
                            pitch: pitch,
                            bearing: bearing,
                            maxBounds: [[20.50, 51.90], [21.50, 52.55]],
                            minZoom: 9.0,
                            maxZoom: 18.0,
                            attributionControl: false,
                            interactive: false
                        });
                        state.map = map;
                        map.on('style.load', function() {
                            state.styleLoaded = true;
                            applyOverlaysToMap();
                        });
                    } else if (state.styleUrl !== styleUrl) {
                        state.styleUrl = styleUrl;
                        state.styleLoaded = false;
                        state.map.setStyle(styleUrl);
                    }
                },

                updateOverlays: function(
                    base64Rgba,
                    width,
                    height,
                    north,
                    south,
                    west,
                    east,
                    showHeatmap,
                    showStations,
                    showToilets,
                    showMiejscaChlodu,
                    is3dMode,
                    stationsGeoJsonStr,
                    inspectionGeoJsonStr,
                    toaletyGeoJsonStr,
                    miejscaChloduGeoJsonStr
                ) {
                    state.showHeatmap = showHeatmap;
                    state.showStations = showStations;
                    state.showToilets = showToilets;
                    state.showMiejscaChlodu = showMiejscaChlodu;
                    state.is3dMode = is3dMode;
                    state.stationsGeoJsonStr = stationsGeoJsonStr;
                    state.inspectionGeoJsonStr = inspectionGeoJsonStr;
                    state.toaletyGeoJsonStr = toaletyGeoJsonStr;
                    state.miejscaChloduGeoJsonStr = miejscaChloduGeoJsonStr;

                    if (base64Rgba && width > 0 && height > 0) {
                        if (!state.offCanvas) {
                            state.offCanvas = document.createElement('canvas');
                        }
                        if (state.offCanvas.width !== width || state.offCanvas.height !== height) {
                            state.offCanvas.width = width;
                            state.offCanvas.height = height;
                        }
                        if (!state.offCanvasCtx) {
                            state.offCanvasCtx = state.offCanvas.getContext('2d');
                        }

                        const binary = atob(base64Rgba);
                        const bytes = new Uint8ClampedArray(binary.length);
                        for (let i = 0; i < binary.length; i++) {
                            bytes[i] = binary.charCodeAt(i);
                        }
                        const imgData = new ImageData(bytes, width, height);
                        state.offCanvasCtx.putImageData(imgData, 0, 0);
                        state.heatmapDataUrl = state.offCanvas.toDataURL('image/png');
                        state.heatmapCoords = [
                            [west, north],
                            [east, north],
                            [east, south],
                            [west, south]
                        ];
                    }

                    applyOverlaysToMap();
                },

                unproject: function(xPhysical, yPhysical) {
                    const map = state.map;
                    if (!map) return '';
                    const dpr = window.devicePixelRatio || 1;
                    const lngLat = map.unproject([xPhysical / dpr, yPhysical / dpr]);
                    return lngLat.lat + ',' + lngLat.lng;
                },

                animateCamera: function(lat, lon, zoom, pitch, bearing) {
                    if (!state.map) return;
                    state.map.easeTo({
                        center: [lon, lat],
                        zoom: zoom,
                        pitch: pitch,
                        bearing: bearing,
                        duration: 600
                    });
                },

                panBy: function(dxPhysical, dyPhysical) {
                    const map = state.map;
                    if (!map) return '';
                    const dpr = window.devicePixelRatio || 1;
                    map.panBy([-dxPhysical / dpr, -dyPhysical / dpr], { animate: false });
                    return formatCameraState(map);
                },

                orbitBy: function(dxPhysical, dyPhysical) {
                    const map = state.map;
                    if (!map) return '';
                    const dpr = window.devicePixelRatio || 1;
                    const newBearing = map.getBearing() + (dxPhysical / dpr) * 0.45;
                    const newPitch = Math.max(0, Math.min(60, map.getPitch() - (dyPhysical / dpr) * 0.45));
                    map.jumpTo({ bearing: newBearing, pitch: newPitch });
                    return formatCameraState(map);
                },

                zoomByScroll: function(scrollDeltaY, cursorXPhysical, cursorYPhysical) {
                    const map = state.map;
                    if (!map) return '';
                    const dpr = window.devicePixelRatio || 1;
                    let zoomChange = 0;
                    const absDelta = Math.abs(scrollDeltaY);
                    if (absDelta >= 10.0) {
                        zoomChange = scrollDeltaY > 0 ? -0.25 : 0.25;
                    } else {
                        zoomChange = -scrollDeltaY * 0.05;
                    }
                    const nextZoom = Math.max(9.0, Math.min(18.0, map.getZoom() + zoomChange));
                    map.easeTo({
                        zoom: nextZoom,
                        around: map.unproject([cursorXPhysical / dpr, cursorYPhysical / dpr]),
                        duration: absDelta >= 10.0 ? 120 : 0
                    });
                    return formatCameraState(map);
                },

                queryStationAt: function(xPhysical, yPhysical) {
                    const map = state.map;
                    if (!map || !state.styleLoaded || !map.getLayer('stations-circle-layer')) return '';
                    const dpr = window.devicePixelRatio || 1;
                    const x = xPhysical / dpr;
                    const y = yPhysical / dpr;
                    const bbox = [[x - 14, y - 14], [x + 14, y + 14]];
                    const features = map.queryRenderedFeatures(bbox, { layers: ['stations-circle-layer', 'stations-symbol-layer'] });
                    if (features && features.length > 0 && features[0].properties) {
                        return features[0].properties.lokalizacja || '';
                    }
                    return '';
                },

                queryToaletaAt: function(xPhysical, yPhysical) {
                    const map = state.map;
                    if (!map || !state.styleLoaded || !map.getLayer('toalety-circle-layer')) return '';
                    const dpr = window.devicePixelRatio || 1;
                    const x = xPhysical / dpr;
                    const y = yPhysical / dpr;
                    const bbox = [[x - 14, y - 14], [x + 14, y + 14]];
                    const features = map.queryRenderedFeatures(bbox, { layers: ['toalety-circle-layer', 'toalety-symbol-layer'] });
                    if (features && features.length > 0 && features[0].properties) {
                        return features[0].properties.id != null ? String(features[0].properties.id) : '';
                    }
                    return '';
                },

                queryMiejsceChloduAt: function(xPhysical, yPhysical) {
                    const map = state.map;
                    if (!map || !state.styleLoaded || !map.getLayer('miejsca-chlodu-circle-layer')) return '';
                    const dpr = window.devicePixelRatio || 1;
                    const x = xPhysical / dpr;
                    const y = yPhysical / dpr;
                    const bbox = [[x - 14, y - 14], [x + 14, y + 14]];
                    const features = map.queryRenderedFeatures(bbox, { layers: ['miejsca-chlodu-circle-layer', 'miejsca-chlodu-symbol-layer'] });
                    if (features && features.length > 0 && features[0].properties) {
                        return features[0].properties.id != null ? String(features[0].properties.id) : '';
                    }
                    return '';
                }
            };
        })();
    </script>
</head>
<body>
<div id="maplibre-host"></div>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
